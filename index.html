<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TickerTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ---------- Theme tokens ---------- */
:root{
  --bg:#eef0f2;
  --surface:#ffffff;
  --surface-2:#f4f5f7;
  --text:#14161a;
  --text-dim:#5b6169;
  --text-faint:#8b9097;
  --border:#d8dce1;
  --bull:#1a8a72;
  --bull-soft:#e2f3ee;
  --bear:#b8483f;
  --bear-soft:#fbe9e7;
  --gold:#96721f;
  --gold-soft:#f5ead0;
  --shadow: 0 1px 2px rgba(20,22,26,0.06);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121317;
    --surface:#1b1d23;
    --surface-2:#212329;
    --text:#eae7e0;
    --text-dim:#9a9ea6;
    --text-faint:#6c7078;
    --border:#2b2e35;
    --bull:#4bb39d;
    --bull-soft:#173028;
    --bear:#d17169;
    --bear-soft:#331e1c;
    --gold:#d9b25c;
    --gold-soft:#2e2716;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121317;
  --surface:#1b1d23;
  --surface-2:#212329;
  --text:#eae7e0;
  --text-dim:#9a9ea6;
  --text-faint:#6c7078;
  --border:#2b2e35;
  --bull:#4bb39d;
  --bull-soft:#173028;
  --bear:#d17169;
  --bear-soft:#331e1c;
  --gold:#d9b25c;
  --gold-soft:#2e2716;
  --shadow: 0 1px 2px rgba(0,0,0,0.4);
}

*{box-sizing:border-box;}
html{
  scroll-padding-top: env(safe-area-inset-top,0px);
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
.serif{ font-family:'Newsreader',Georgia,serif; }
button{ font-family:inherit; }
a{ color:inherit; }
::selection{ background:var(--gold-soft); }

/* ---------- Layout shell ---------- */
.app{
  max-width:640px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* ---------- Header / tape ---------- */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  padding-top: env(safe-area-inset-top,0px);
  background:var(--bg);
  border-bottom:1px solid var(--border);
}
.brand-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:14px 18px 10px;
}
.brand{
  font-family:'Newsreader',serif;
  font-style:italic;
  font-weight:600;
  font-size:1.5rem;
  letter-spacing:0.2px;
}
.brand span{ color:var(--gold); font-style:normal; }
.theme-toggle{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-dim);
  border-radius:20px;
  padding:5px 12px;
  font-size:0.72rem;
  cursor:pointer;
}
.theme-toggle:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

.tape{
  overflow:hidden;
  white-space:nowrap;
  border-top:1px solid var(--border);
  background:var(--surface-2);
}
.tape-track{
  display:inline-flex;
  gap:26px;
  padding:7px 18px;
  animation:scroll 38s linear infinite;
}
@media (prefers-reduced-motion: reduce){
  .tape-track{ animation:none; }
}
.tape-item{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.75rem;
  color:var(--text-dim);
}
.tape-item b{ color:var(--text); font-weight:600; margin-right:5px;}
.tape-up{ color:var(--bull); }
.tape-down{ color:var(--bear); }
@keyframes scroll{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-50%); }
}

/* ---------- Top gainers strip ---------- */
.gainers-wrap{
  padding:10px 18px 2px;
}
.gainers-label{
  font-size:0.68rem;
  color:var(--text-faint);
  margin-bottom:7px;
  display:flex;
  align-items:center;
  gap:5px;
}
.gainers-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:2px;
}
.gainer-card{
  flex:0 0 auto;
  background:var(--bull-soft);
  border:1px solid var(--bull);
  border-radius:11px;
  padding:7px 11px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:74px;
}
.gainer-sym{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:0.8rem;
  color:var(--text);
}
.gainer-chg{
  font-family:'IBM Plex Mono',monospace;
  font-size:0.72rem;
  color:var(--bull);
  font-weight:600;
}

/* ---------- Stories bar ---------- */
.stories-wrap{ padding:12px 18px 2px; }
.stories-row{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding-bottom:4px;
}
.story-item{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  background:none;
  border:none;
  cursor:pointer;
  width:54px;
}
.story-item .avatar-lg{
  width:46px; height:46px; font-size:0.95rem;
  box-shadow:0 0 0 2.5px var(--surface), 0 0 0 4px var(--gold);
}
.story-name{
  font-size:0.65rem;
  color:var(--text-dim);
  max-width:54px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ---------- Filter chips ---------- */
.feed-tabs{
  display:flex;
  border-bottom:1px solid var(--border);
  margin:6px 18px 0;
}
.feed-tab{
  flex:1;
  background:none;
  border:none;
  padding:11px 0 10px;
  font-size:0.86rem;
  font-weight:700;
  color:var(--text-faint);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.feed-tab.active{
  color:var(--text);
  border-bottom-color:var(--gold);
}
.suggest-list{
  margin-top:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.suggest-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px 13px;
  box-shadow:var(--shadow);
}
.suggest-info{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.chiprow{
  display:flex;
  gap:8px;
  padding:12px 18px 2px;
  overflow-x:auto;
}
.chip{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-dim);
  padding:6px 13px;
  border-radius:20px;
  font-size:0.8rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
}
.chip.active{
  background:var(--text);
  color:var(--bg);
  border-color:var(--text);
}
.chip .dot{ width:6px; height:6px; border-radius:50%; }

/* ---------- Main scroll area ---------- */
.view{
  flex:1;
  padding:10px 18px 100px;
}
.hidden{ display:none !important; }

/* ---------- Post card ---------- */
.post{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px 16px 14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  transition:background 0.15s;
}
.post:active{ background:var(--surface-2); }
.post-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}
.post-author-link{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
  background:none;
  border:none;
  padding:0;
  text-align:left;
  cursor:pointer;
}
.post-top-meta{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.meta-sub{
  font-size:0.7rem;
  color:var(--text-faint);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.post-ticker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  background:var(--surface-2);
  border:none;
  padding:5px 11px 5px 7px;
  border-radius:20px;
  margin-bottom:10px;
}
.ticker-sym{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:0.92rem;
}
.sent-badge{
  font-size:0.66rem;
  font-weight:600;
  padding:2px 7px;
  border-radius:5px;
  letter-spacing:0.3px;
}
.sent-bull{ color:var(--bull); background:var(--bull-soft); }
.sent-bear{ color:var(--bear); background:var(--bear-soft); }
.sent-neutral{ color:var(--text-dim); background:var(--surface-2); }
.post-time{
  color:var(--text-faint);
  font-size:0.74rem;
}
.post-body{
  font-size:0.93rem;
  line-height:1.5;
  color:var(--text);
  margin-bottom:10px;
  word-wrap:break-word;
}
.post-action{
  display:flex;
  align-items:center;
  gap:5px;
  background:none;
  border:none;
  color:var(--text-faint);
  font-size:0.8rem;
  cursor:pointer;
  padding:4px 2px;
}
.post-action.agreed{ color:var(--gold); }
.post-action svg{ width:15px; height:15px; }
.post-foot{
  display:flex;
  align-items:center;
  gap:16px;
}
.post-author{
  display:flex;
  align-items:center;
  gap:7px;
  flex:1;
  min-width:0;
}
.avatar{
  width:22px; height:22px;
  border-radius:50%;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:0.6rem;
  font-weight:700;
  color:#fff;
}
.avatar-lg{ width:38px; height:38px; font-size:0.8rem; }
.handle{
  color:var(--text);
  font-size:0.88rem;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.verified-badge{
  width:13px; height:13px;
  color:var(--gold);
  flex:0 0 auto;
}
.agree-rate{
  color:var(--text-faint);
  font-size:0.7rem;
  font-weight:400;
}
.agree-rate.high{ color:var(--bull); }
.post-action.liked{ color:var(--bear); }

/* ---------- Trending view ---------- */
.section-label{
  font-size:0.72rem;
  color:var(--text-faint);
  margin:6px 2px 10px;
}
.tick-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 15px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
}
.tick-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.tick-name{ color:var(--text-dim); font-size:0.78rem; margin-top:2px;}
.tick-price{ text-align:right; }
.tick-price .px{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:0.98rem; }
.tick-price .chg{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; }
.up{ color:var(--bull); }
.down{ color:var(--bear); }
.tick-mid{
  display:flex;
  align-items:center;
  gap:12px;
  margin:10px 0 8px;
}
.spark{ flex:0 0 auto; }
.gauge{
  flex:1;
  height:6px;
  border-radius:4px;
  overflow:hidden;
  display:flex;
  background:var(--surface-2);
}
.gauge-bull{ background:var(--bull); }
.gauge-bear{ background:var(--bear); }
.tick-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.mentions{ color:var(--text-faint); font-size:0.74rem; }
.watch-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--text-dim);
  border-radius:8px;
  padding:5px 10px;
  font-size:0.74rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:5px;
}
.watch-btn svg{ width:14px; height:14px; flex:0 0 auto; }
.watch-btn.on{ color:var(--gold); border-color:var(--gold); background:var(--gold-soft); }

.follow-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--text-dim);
  border-radius:7px;
  padding:4px 9px;
  font-size:0.7rem;
  font-weight:600;
  cursor:pointer;
  flex:0 0 auto;
}
.follow-btn.on{ color:var(--text-faint); border-color:var(--border); background:var(--surface-2); }

.filter-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 13px;
  margin-bottom:12px;
  font-size:0.8rem;
  color:var(--text-dim);
}
.filter-clear{
  background:none;
  border:none;
  color:var(--text-dim);
  font-size:0.76rem;
  font-weight:600;
  cursor:pointer;
}

/* ---------- Watchlist view ---------- */
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--text-faint);
}
.empty .big{ font-family:'Newsreader',serif; font-style:italic; font-size:1.3rem; color:var(--text-dim); margin-bottom:6px;}

/* ---------- Bottom nav ---------- */
.navbar{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:30;
  display:flex;
  justify-content:center;
}
.navbar-inner{
  width:100%;
  max-width:640px;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom: env(safe-area-inset-bottom,0px);
}
.navbtn{
  flex:1;
  background:none;
  border:none;
  padding:10px 4px 8px;
  color:var(--text-faint);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:0.66rem;
  cursor:pointer;
}
.navbtn svg{ width:20px; height:20px; }
.navbtn.active{ color:var(--text); }
.navbtn.active svg{ color:var(--gold); }
.navbtn.postbtn svg{ color:var(--bg); }
.navbtn.postbtn .navcircle{
  width:34px; height:34px;
  border-radius:50%;
  background:var(--gold);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:1px;
}
.navbtn.postbtn.active .navcircle{ background:var(--text); }

/* ---------- Composer sheet ---------- */
.sheet-overlay{
  position:fixed; inset:0;
  background:rgba(10,10,12,0.45);
  z-index:40;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.sheet{
  width:100%;
  max-width:640px;
  background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88vh;
  overflow-y:auto;
}
.sheet-handle{
  width:36px; height:4px; border-radius:3px;
  background:var(--border);
  margin:0 auto 14px;
}
.sheet-head{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:14px;
}
.sheet-title{ font-family:'Newsreader',serif; font-weight:600; font-size:1.15rem; }
.sheet-close{
  background:none; border:none; color:var(--text-faint);
  font-size:1.3rem; cursor:pointer; line-height:1; padding:2px 6px;
}
label.field-label{
  font-size:0.74rem; color:var(--text-faint); display:block; margin:14px 0 6px;
}
.ticker-picker{
  display:flex; flex-wrap:wrap; gap:7px;
}
.ticker-pick{
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace;
  font-size:0.78rem;
  padding:6px 11px;
  border-radius:8px;
  cursor:pointer;
}
.ticker-pick.sel{ background:var(--text); color:var(--bg); border-color:var(--text); }
.sent-picker{ display:flex; gap:8px; }
.sent-pick{
  flex:1;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text-dim);
  padding:9px 0;
  border-radius:10px;
  font-size:0.82rem;
  font-weight:600;
  cursor:pointer;
}
.sent-pick.sel-bull{ background:var(--bull-soft); color:var(--bull); border-color:var(--bull); }
.sent-pick.sel-bear{ background:var(--bear-soft); color:var(--bear); border-color:var(--bear); }
.sent-pick.sel-neutral{ background:var(--surface-2); color:var(--text); border-color:var(--text-dim); }
#tfPicker .sent-pick{ background:var(--surface-2); color:var(--text-dim); border-color:var(--border); }
#tfPicker .sent-pick.sel{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold); }
.composer-text{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  font-family:inherit;
  font-size:0.92rem;
  line-height:1.5;
}
.charcount{
  text-align:right; font-size:0.72rem; color:var(--text-faint); margin-top:5px;
}
.post-submit{
  width:100%;
  margin-top:16px;
  background:var(--text);
  color:var(--bg);
  border:none;
  border-radius:11px;
  padding:13px 0;
  font-size:0.92rem;
  font-weight:600;
  cursor:pointer;
}
.post-submit:disabled{ opacity:0.4; cursor:not-allowed; }

/* ---------- Ticker detail sheet ---------- */
.detail-head{
  display:flex; align-items:center; gap:10px; margin-bottom:4px;
}
.detail-sym{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.3rem; }
.detail-sub{ color:var(--text-dim); font-size:0.85rem; margin-bottom:14px; }
.detail-stats{
  display:flex; gap:20px; margin-bottom:16px;
}
.dstat .n{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1rem; }
.dstat .l{ font-size:0.7rem; color:var(--text-faint); }

/* ---------- Comments ---------- */
.comment{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid var(--border);
}
.comment:last-child{ border-bottom:none; }
.comment-meta{ min-width:0; flex:1; }
.comment-head{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:3px;
}
.comment-handle{ font-size:0.82rem; font-weight:700; }
.comment-time{ font-size:0.7rem; color:var(--text-faint); }
.comment-body{ font-size:0.88rem; line-height:1.45; word-wrap:break-word; }
.comment-box{
  display:flex;
  gap:8px;
  align-items:flex-end;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
}
.comment-box .composer-text{ min-height:44px; height:44px; }
.comment-send{
  background:var(--text);
  color:var(--bg);
  border:none;
  border-radius:10px;
  padding:12px 16px;
  font-size:0.85rem;
  font-weight:600;
  cursor:pointer;
  flex:0 0 auto;
}
.comment-send:disabled{ opacity:0.4; cursor:not-allowed; }

/* ---------- Profile sheet ---------- */
.profile-head{
  display:flex;
  align-items:flex-start;
  gap:14px;
  margin-bottom:12px;
}
.profile-avatar{
  width:64px; height:64px;
  border-radius:50%;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:1.15rem;
  font-weight:700;
  color:#fff;
}
.profile-name-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:4px;
}
.profile-handle{
  font-family:'Newsreader',serif;
  font-weight:600;
  font-size:1.2rem;
}
.profile-bio{
  font-size:0.86rem;
  color:var(--text-dim);
  line-height:1.4;
  margin-bottom:12px;
}
.profile-stats{
  display:flex;
  gap:22px;
  margin-bottom:14px;
}
.profile-stats .dstat{ cursor:default; }

/* scrollbar tidy */
::-webkit-scrollbar{ width:0; height:0; }
</style>

      sent: row.sentiment,
      timeframe: row.timeframe || 'swing',

/* ================= Helpers ================= */
function sentLabel(s){ return s==="bull" ? "Bullish" : s==="bear" ? "Bearish" : "Neutral"; }
function sentClass(s){ return s==="bull" ? "sent-bull" : s==="bear" ? "sent-bear" : "sent-neutral"; }
function tfLabel(tf){ return tf==="day" ? "Day trade" : tf==="long" ? "Long term" : "Swing"; }

function sparkline(hist, w, h, colorVar){
  const min = Math.min(...hist), max = Math.max(...hist);
  const range = (max-min) || 1;
  const step = w/(hist.length-1);
  const pts = hist.map((v,i)=> `${(i*step).toFixed(1)},${(h - ((v-min)/range)*h).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(${colorVar})" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function mentionCount(sym){
  return posts.filter(p=>p.sym===sym).length;
}
function sentimentSplit(sym){
  const ps = posts.filter(p=>p.sym===sym);
  const bull = ps.filter(p=>p.sent==="bull").length;
  const bear = ps.filter(p=>p.sent==="bear").length;
  const total = bull+bear || 1;
  return { bullPct: Math.round(bull/total*100), bearPct: Math.round(bear/total*100), bull, bear };
}

}

const AVATAR_PALETTE = ["#1a8a72","#b8483f","#96721f","#4a68a8","#7a5cb0","#c06a2f"];
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function avatarHTML(handle, large){
  const initials = handle.replace("@","").slice(0,2).toUpperCase();
  const color = AVATAR_PALETTE[hashStr(handle) % AVATAR_PALETTE.length];
  return `<span class="avatar${large?' avatar-lg':''}" style="background:${color}">${initials}</span>`;
}

function postCardHTML(p){
  const agreed = !!userState.agreed[p.id];
  const liked = !!userState.liked[p.id];
  const prof = p.profile || {handle:"@you", verified:false, agreeRate:null, followers:null};
  const isSelf = prof.handle === "@you";
  const followingThem = userState.following.includes(prof.handle);
  const subBits = [];
  if(prof.followers!=null) subBits.push(`${fmtCount(prof.followers)} followers`);
  subBits.push(relTime(Math.round((Date.now()-p.time)/60000)));
  return `
  <article class="post" data-id="${p.id}">
    <div class="post-top">
      <button class="post-author-link" data-handle="${prof.handle}">
        ${avatarHTML(prof.handle, true)}
        <div class="post-top-meta">
          <span class="handle">${prof.verified ? verifiedIcon : ""}${prof.handle}</span>
          <span class="meta-sub">${subBits.join(" &middot; ")}</span>
        </div>
      </button>
      ${isSelf ? "" : `<button class="follow-btn ${followingThem?'on':''}" data-handle="${prof.handle}">${followingThem?'Following':'Follow'}</button>`}
    </div>
    <button class="post-ticker" data-sym="${p.sym}">
      <span class="ticker-sym">${p.sym}</span>
      <span class="sent-badge ${sentClass(p.sent)}">${sentLabel(p.sent)}</span>
      <span class="sent-badge sent-neutral">${tfLabel(p.timeframe || 'swing')}</span>
    </button>
    <div class="post-body">${p.text}</div>
    <div class="post-foot">
      <button class="post-action like-btn ${liked?'liked':''}" data-id="${p.id}">${heartIconHTML(liked)}<span>${p.likes}</span></button>
      <button class="post-action agree-btn ${agreed?'agreed':''}" data-id="${p.id}">${agreeIcon}<span>${p.agrees}</span></button>
      <button class="post-action reply-btn" data-id="${p.id}">${replyIcon}<span>${p.replies}</span></button>
    </div>
  </article>`;
}

function renderFeed(){
  const el = document.getElementById("view-feed");
  let list = posts.slice().sort((a,b)=>b.time-a.time);
  let banner = "";
  if(authorFilter){
    list = list.filter(p=>p.profile && p.profile.handle===authorFilter);
    banner = `<div class="filter-banner">Posts from <b>${authorFilter}</b><button class="filter-clear" id="clearAuthorFilter">&times; Clear</button></div>`;
  }else{
    if(feedTab==="following") list = list.filter(p=>p.profile && userState.following.includes(p.profile.handle));
    if(currentFilter==="bull") list = list.filter(p=>p.sent==="bull");
    if(currentFilter==="bear") list = list.filter(p=>p.sent==="bear");
    if(currentFilter==="watch") list = list.filter(p=>userState.watch.includes(p.sym));
  }

  if(!list.length){
    if(!authorFilter && feedTab==="following" && !userState.following.length){
      const suggested = PROFILES.slice().sort((a,b)=>b.followers-a.followers).slice(0,5);
      el.innerHTML = `
        <div class="empty"><div class="big">Your Following feed is empty</div>Follow a few traders to see their calls here.</div>
        <div class="suggest-list">
          ${suggested.map(p=>`
            <div class="suggest-row">
              <div class="suggest-info">
                ${avatarHTML(p.handle, true)}
                <div class="post-top-meta">
                  <span class="handle">${p.verified ? verifiedIcon : ""}${p.handle}</span>
                  <span class="meta-sub">${fmtCount(p.followers)} followers</span>
                </div>
              </div>
              <button class="follow-btn" data-handle="${p.handle}">Follow</button>
            </div>`).join("")}
        </div>`;
      return;
    }
    let msg = "Try a different filter, or be the first to post.";
    if(authorFilter) msg = "No posts from this trader yet.";
    else if(currentFilter==="watch") msg = "Star a few tickers and their posts will show up in this tab.";
    el.innerHTML = banner + `<div class="empty"><div class="big">Nothing here yet</div>${msg}</div>`;
    return;
  }
  el.innerHTML = banner + list.map(postCardHTML).join("");
}

function toggleFollow(handle){
  const i = userState.following.indexOf(handle);
  if(i>-1) userState.following.splice(i,1);
  else userState.following.push(handle);
  saveState();
}

async function toggleAgree(id){
  const p = posts.find(p=>p.id===id);
  if(!p) return;
  const already = !!userState.agreed[id];
  if(already){ delete userState.agreed[id]; p.agrees -= 1; }
  else{ userState.agreed[id] = true; p.agrees += 1; }
  saveState();
  if(p.real && sb && currentUser){
    try{
      if(already) await sb.from("post_agrees").delete().eq("post_id", id).eq("user_id", currentUser.id);
      else await sb.from("post_agrees").insert({ post_id: id, user_id: currentUser.id });
    }catch(e){ /* best-effort — local count already updated */ }
  }
}

}

  const verified = mock ? mock.verified : (authoredPosts[0] && authoredPosts[0].profile && authoredPosts[0].profile.verified);
  const followingThem = userState.following.includes(handle);

  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.id = "profileOverlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>

        <div style="flex:1; min-width:0;">
          <div class="profile-name-row">
            <span class="profile-handle">${handle}</span>
            ${verified ? verifiedIcon : ""}
          </div>
          <div class="profile-stats" id="profileStats">
            <div class="dstat"><div class="n">${authoredPosts.length}</div><div class="l">posts</div></div>
            <div class="dstat"><div class="n">${mock ? fmtCount(mock.followers) : '&mdash;'}</div><div class="l">followers</div></div>
          </div>
        </div>
      </div>
      <div class="profile-bio" id="profileBio">${isSelf ? '' : ''}</div>
      ${isSelf ? '' : `<button class="follow-btn ${followingThem?'on':''}" id="profileFollowBtn" style="width:100%; justify-content:center; padding:9px 0; margin-bottom:14px;">${followingThem?'Following':'Follow'}</button>`}
      <label class="field-label" style="margin-top:0;">Posts</label>
      <div id="profilePosts">${authoredPosts.length ? authoredPosts.map(postCardHTML).join("") : '<div class="empty" style="padding:30px 10px;">No posts yet.</div>'}</div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener("click",(e)=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById("closeProfile").addEventListener("click", ()=> overlay.remove());

  const followBtn = document.getElementById("profileFollowBtn");
  if(followBtn){
    followBtn.addEventListener("click", ()=>{
      toggleFollow(handle);
      overlay.remove();
      openProfile(handle);
      renderFeed();
    });
  }

  // load real bio if this is a real (non-mock) account
  if(sb && !mock){
    try{
      const { data } = await sb.from("profiles").select("bio").eq("handle", handle).maybeSingle();
      if(data && data.bio){
        document.getElementById("profileBio").textContent = data.bio;
      }
    }catch(e){ /* leave blank */ }
  }

  document.getElementById("profilePosts").addEventListener("click",(e)=>{
    const likeBtn = e.target.closest(".like-btn");
    if(likeBtn){
      const id = likeBtn.dataset.id;
      const p = posts.find(p=>p.id===id);
      const already = !!userState.liked[id];
      if(already){ delete userState.liked[id]; p.likes -= 1; }
      else{ userState.liked[id] = true; p.likes += 1; }
      saveState();
      overlay.remove();
      openProfile(handle);
      renderFeed();
      return;
    }
    const agreeBtn = e.target.closest(".agree-btn");
    if(agreeBtn){
      toggleAgree(agreeBtn.dataset.id);
      overlay.remove();
      openProfile(handle);
      renderFeed();
      return;
    }
    const replyBtn = e.target.closest(".reply-btn");
    if(replyBtn){ openComments(replyBtn.dataset.id); return; }
    const tickBtn = e.target.closest(".post-ticker");
    if(tickBtn){ overlay.remove(); openDetail(tickBtn.dataset.sym); }
  });
}

  const up = t.chg >= 0;
  const watched = userState.watch.includes(t.sym);
  return `
  <div class="tick-card">
    <div class="tick-top">
      <button class="post-ticker" data-sym="${t.sym}" style="flex-direction:column;align-items:flex-start;">
        <span class="ticker-sym" style="font-size:1.02rem;">${t.sym}</span>

        <div class="px">$${t.price.toFixed(2)}</div>

      </div>
    </div>
    <div class="tick-mid">
      ${sparkline(t.hist, 84, 28, up?'--bull':'--bear')}
      <div class="gauge" title="${bullPct}% bullish / ${bearPct}% bearish">

function renderTrending(){
  const el = document.getElementById("view-trending");
  const sorted = TICKERS.slice().sort((a,b)=> mentionCount(b.sym) - mentionCount(a.sym));
  el.innerHTML = `<div class="section-label">Ranked by chatter in the last 24 hours — not by who's paying for placement.</div>` +
    sorted.map(tickCardHTML).join("");
}

document.getElementById("view-trending").addEventListener("click",(e)=>{
  const watchBtn = e.target.closest(".watch-btn");
  if(watchBtn){ toggleWatch(watchBtn.dataset.sym); return; }
  const tickBtn = e.target.closest(".post-ticker");
  if(tickBtn){ openDetail(tickBtn.dataset.sym); }
});

function toggleWatch(sym){
  const i = userState.watch.indexOf(sym);
  const adding = i === -1;
  if(i>-1) userState.watch.splice(i,1);
  else userState.watch.push(sym);
  saveState();
  renderTrending();
  renderWatch();
  if(currentFilter==="watch") renderFeed();
  if(sb && currentUser){
    if(adding) sb.from("watchlist_items").insert({ user_id: currentUser.id, sym: sym }).then(()=>{}, ()=>{});
    else sb.from("watchlist_items").delete().eq("user_id", currentUser.id).eq("sym", sym).then(()=>{}, ()=>{});
  }
}

    return;

  const list = TICKERS.filter(t=>userState.watch.includes(t.sym));
  el.innerHTML = `<div class="section-label">Tickers you're tracking</div>` + list.map(tickCardHTML).join("");
}

/* ================= Auth ================= */
function updateAuthUI(){
  const btn = document.getElementById("authBtn");
  btn.textContent = currentUser ? currentUser.handle : "Log in";
}

async function loadProfile(userId){
  const { data } = await sb.from("profiles").select("handle").eq("id", userId).maybeSingle();
  return data ? data.handle : null;
}

async function ensureProfile(userId, emailOrHandle){
  let handle = emailOrHandle.startsWith("@") ? emailOrHandle : "@"+emailOrHandle.split("@")[0].replace(/[^a-zA-Z0-9_]/g,"").slice(0,20);
  if(handle === "@") handle = "@trader"+Math.floor(Math.random()*10000);
  try{ await sb.from("profiles").insert({ id: userId, handle: handle }); }catch(e){ /* row may already exist */ }
  return handle;
}

async function syncWatchlistFromServer(){
  if(!sb || !currentUser) return;
  try{
    const { data } = await sb.from("watchlist_items").select("sym").eq("user_id", currentUser.id);
    if(data){
      userState.watch = data.map(r => r.sym);
      saveState();
      renderTrending();
      renderWatch();
      if(currentFilter==="watch") renderFeed();
    }
  }catch(e){ /* keep local watchlist as-is */ }
}

async function refreshSession(){
  if(!sb) return;
  const { data } = await sb.auth.getSession();
  const session = data && data.session;
  if(session){
    let handle = await loadProfile(session.user.id);
    if(!handle) handle = await ensureProfile(session.user.id, session.user.email || "trader");
    currentUser = { id: session.user.id, handle: handle };
    syncWatchlistFromServer();
  }
  updateAuthUI();
}

function buildAuthSheet(){
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.id = "authOverlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title" id="authTitle">Log in</div>
        <button class="sheet-close" id="closeAuth">&times;</button>
      </div>
      <div id="authError" style="color:var(--bear); font-size:0.8rem; margin-bottom:10px; display:none;"></div>
      <label class="field-label" style="margin-top:0;">Email</label>
      <textarea class="composer-text" id="authEmail" style="min-height:auto; height:44px;" placeholder="you@example.com"></textarea>
      <label class="field-label" id="handleLabel" style="display:none;">Handle</label>
      <textarea class="composer-text" id="authHandle" style="min-height:auto; height:44px; display:none;" placeholder="@yourname"></textarea>
      <label class="field-label">Password</label>
      <textarea class="composer-text" id="authPassword" style="min-height:auto; height:44px;" placeholder="At least 6 characters"></textarea>
      <button class="post-submit" id="authSubmit">Log in</button>
      <button class="follow-btn" id="authSwitch" style="width:100%; justify-content:center; margin-top:10px; padding:9px 0;">Need an account? Sign up</button>
    </div>`;
  document.body.appendChild(overlay);

  let mode = "login";
  const title = document.getElementById("authTitle");
  const handleLabel = document.getElementById("handleLabel");
  const handleField = document.getElementById("authHandle");
  const submitBtn = document.getElementById("authSubmit");
  const switchBtn = document.getElementById("authSwitch");
  const errorEl = document.getElementById("authError");

  function setMode(m){
    mode = m;
    const isSignup = mode === "signup";
    title.textContent = isSignup ? "Sign up" : "Log in";
    handleLabel.style.display = isSignup ? "block" : "none";
    handleField.style.display = isSignup ? "block" : "none";
    submitBtn.textContent = isSignup ? "Create account" : "Log in";
    switchBtn.textContent = isSignup ? "Have an account? Log in" : "Need an account? Sign up";
    errorEl.style.display = "none";
  }
  switchBtn.addEventListener("click", ()=> setMode(mode === "signup" ? "login" : "signup"));

  overlay.addEventListener("click",(e)=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById("closeAuth").addEventListener("click", ()=> overlay.remove());

  submitBtn.addEventListener("click", async ()=>{
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    const handle = document.getElementById("authHandle").value.trim();
    errorEl.style.display = "none";
    if(!email || !password){
      errorEl.textContent = "Enter an email and password.";
      errorEl.style.display = "block";
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Working...";
    try{
      if(mode === "signup"){
        if(!handle){
          errorEl.textContent = "Pick a handle.";
          errorEl.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
          return;
        }
        const cleanHandle = handle.startsWith("@") ? handle : "@"+handle;
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(data.user){
          await sb.from("profiles").insert({ id: data.user.id, handle: cleanHandle });
          if(data.session){
            currentUser = { id: data.user.id, handle: cleanHandle };
            updateAuthUI();
            syncWatchlistFromServer();
            overlay.remove();
          }else{
            try{ localStorage.setItem("tickertalk_pending_handle_"+email, cleanHandle); }catch(e){}
            errorEl.style.color = "var(--bull)";
            errorEl.textContent = "Check your email to confirm your account, then log in.";
            errorEl.style.display = "block";
            setMode("login");
          }
        }
      }else{
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
        let h = await loadProfile(data.user.id);
        if(!h){
          let pending = null;
          try{ pending = localStorage.getItem("tickertalk_pending_handle_"+email); }catch(e){}
          h = await ensureProfile(data.user.id, pending || data.user.email || email);
          try{ localStorage.removeItem("tickertalk_pending_handle_"+email); }catch(e){}
        }
        currentUser = { id: data.user.id, handle: h };
        updateAuthUI();
        syncWatchlistFromServer();
        overlay.remove();
      }
    }catch(err){
      errorEl.style.color = "var(--bear)";
      errorEl.textContent = err.message || "Something went wrong.";
      errorEl.style.display = "block";
    }
    submitBtn.disabled = false;
    submitBtn.textContent = mode === "signup" ? "Create account" : "Log in";
  });
}

let composerSent = "bull";
let composerSym = TICKERS[0].sym;
let composerTimeframe = "swing";

function buildComposer(prefillSym){
  composerSym = prefillSym || TICKERS[0].sym;
  composerSent = "bull";
  composerTimeframe = "swing";
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.id = "composerOverlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title">Share an idea</div>
        <button class="sheet-close" id="closeComposer">&times;</button>
      </div>
      <label class="field-label">Ticker</label>
      <div class="ticker-picker" id="tickerPicker">
        ${TICKERS.map(t=>`<button class="ticker-pick ${t.sym===composerSym?'sel':''}" data-sym="${t.sym}">${t.sym}</button>`).join("")}
      </div>
      <label class="field-label">Your take</label>
      <div class="sent-picker">
        <button class="sent-pick sel-bull" data-sent="bull">Bullish</button>
        <button class="sent-pick" data-sent="bear">Bearish</button>
        <button class="sent-pick" data-sent="neutral">Neutral</button>
      </div>
      <label class="field-label">Timeframe</label>
      <div class="sent-picker" id="tfPicker">
        <button class="sent-pick" data-tf="day">Day trade</button>
        <button class="sent-pick sel" data-tf="swing">Swing</button>
        <button class="sent-pick" data-tf="long">Long term</button>
      </div>
      <label class="field-label">Post</label>
      <textarea class="composer-text" id="composerText" maxlength="240" placeholder="What's your thesis? Keep it sharp."></textarea>
      <div class="charcount"><span id="charN">0</span>/240</div>
      <button class="post-submit" id="submitPost" disabled>Post to feed</button>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener("click",(e)=>{ if(e.target === overlay) closeComposer(); });
  document.getElementById("closeComposer").addEventListener("click", closeComposer);

  overlay.querySelectorAll(".ticker-pick").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      overlay.querySelectorAll(".ticker-pick").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      composerSym = btn.dataset.sym;
    });
  });

  overlay.querySelectorAll(".sent-picker:not(#tfPicker) .sent-pick").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      overlay.querySelectorAll(".sent-picker:not(#tfPicker) .sent-pick").forEach(b=>b.className="sent-pick");
      composerSent = btn.dataset.sent;
      btn.classList.add("sent-pick","sel-"+composerSent);
    });
  });

  overlay.querySelectorAll("#tfPicker .sent-pick").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      overlay.querySelectorAll("#tfPicker .sent-pick").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      composerTimeframe = btn.dataset.tf;
    });
  });

  const textarea = document.getElementById("composerText");
  const charN = document.getElementById("charN");
  const submitBtn = document.getElementById("submitPost");
  textarea.addEventListener("input", ()=>{
    charN.textContent = textarea.value.length;
    submitBtn.disabled = textarea.value.trim().length < 4;
  });

  submitBtn.addEventListener("click", async ()=>{
    const text = textarea.value.trim();
    if(text.length < 4) return;
    if(!currentUser){
      closeComposer();
      buildAuthSheet();
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Posting...";
    let newPost = {
      id: "u_"+Date.now(),
      sym: composerSym,
      sent: composerSent,
      timeframe: composerTimeframe,
      text: text,
      time: Date.now(),
      profile: { handle: currentUser.handle, verified: false, agreeRate: null, followers: null },
      agrees: 0,
      replies: 0,
      likes: 0,
      real: false
    };
    if(sb){
      const { data, error } = await sb.from("posts").insert({
        user_id: currentUser.id, sym: composerSym, sentiment: composerSent, body: text, timeframe: composerTimeframe
      }).select().single();
      if(!error && data){
        newPost.id = data.id;
        newPost.real = true;
      }
    }
    if(!newPost.real){
      userState.userPosts.unshift(newPost);
      saveState();
    }
    posts.unshift(newPost);
    submitBtn.disabled = false;
    submitBtn.textContent = "Post to feed";
    closeComposer();
    currentFilter = "all";
    feedTab = "foryou";
    authorFilter = null;
    document.querySelectorAll("#feedTabs .feed-tab").forEach(t=>t.classList.remove("active"));
    document.querySelector('#feedTabs .feed-tab[data-tab="foryou"]').classList.add("active");
    document.querySelectorAll("#feedChips .chip").forEach(c=>c.classList.remove("active"));
    document.querySelector('#feedChips .chip[data-filter="all"]').classList.add("active");
    document.querySelectorAll(".navbtn[data-view]").forEach(b=>b.classList.remove("active"));
    document.querySelector('.navbtn[data-view="feed"]').classList.add("active");
    Object.values(views).forEach(id=>document.getElementById(id).classList.add("hidden"));
    document.getElementById("view-feed").classList.remove("hidden");
    renderFeed();
    renderTrending();
  });

  setTimeout(()=>textarea.focus(), 50);
}

      <div class="comment-box">
        <textarea class="composer-text" id="commentText" maxlength="240" placeholder="${currentUser ? 'Add a reply...' : 'Log in to reply...'}"></textarea>
        <button class="comment-send" id="sendComment">Post</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener("click",(e)=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById("closeComments").addEventListener("click", ()=> overlay.remove());

  // reuse the same action handlers as the feed (like/agree/follow/ticker) on the embedded post card
  overlay.querySelector(".post").addEventListener("click",(e)=>{
    const likeBtn = e.target.closest(".like-btn");
    if(likeBtn){
      const id = likeBtn.dataset.id;
      const already = !!userState.liked[id];
      if(already){ delete userState.liked[id]; p.likes -= 1; }
      else{ userState.liked[id] = true; p.likes += 1; }
      saveState();
      renderFeed();
      return;
    }
    const agreeBtn = e.target.closest(".agree-btn");
    if(agreeBtn){ toggleAgree(agreeBtn.dataset.id); renderFeed(); return; }
    const tickBtn = e.target.closest(".post-ticker");
    if(tickBtn){ overlay.remove(); openDetail(tickBtn.dataset.sym); }
  });

  let localComments = [];

  async function loadComments(){
    if(!sb || p.id.toString().startsWith("seed_") || p.id.toString().startsWith("u_")){
      // demo/local posts have no real backend thread
      document.getElementById("commentsList").innerHTML = `<div class="empty" style="padding:20px 10px;">No comments yet. Be the first to reply.</div>`;
      return;
    }
    try{
      const { data, error } = await sb
        .from("comments")
        .select("*, profiles(handle)")
        .eq("post_id", p.id)
        .order("created_at", { ascending: true });
      if(error || !data){
        document.getElementById("commentsList").innerHTML = `<div class="empty" style="padding:20px 10px;">Couldn't load comments.</div>`;
        return;
      }
      localComments = data.map(row=>({
        id: row.id,
        handle: (row.profiles && row.profiles.handle) || "@someone",
        body: row.body,
        time: new Date(row.created_at).getTime()
      }));
      renderCommentsList();
    }catch(e){
      document.getElementById("commentsList").innerHTML = `<div class="empty" style="padding:20px 10px;">Couldn't load comments.</div>`;
    }
  }

  function renderCommentsList(){
    const listEl = document.getElementById("commentsList");
    if(!localComments.length){
      listEl.innerHTML = `<div class="empty" style="padding:20px 10px;">No comments yet. Be the first to reply.</div>`;
      return;
    }
    listEl.innerHTML = localComments.map(commentRowHTML).join("");
  }

  await loadComments();

  document.getElementById("sendComment").addEventListener("click", async ()=>{
    const textarea = document.getElementById("commentText");
    const text = textarea.value.trim();
    if(text.length < 1) return;
    if(!currentUser){
      overlay.remove();
      buildAuthSheet();
      return;
    }
    if(p.id.toString().startsWith("seed_") || p.id.toString().startsWith("u_")){
      // demo post — no backend row to attach to, show locally only
      localComments.push({ id:"local_"+Date.now(), handle: currentUser.handle, body:text, time: Date.now() });
      p.replies += 1;
      renderCommentsList();
      renderFeed();
      textarea.value = "";
      return;
    }
    const sendBtn = document.getElementById("sendComment");
    sendBtn.disabled = true;
    try{
      const { data, error } = await sb.from("comments").insert({
        post_id: p.id, user_id: currentUser.id, body: text
      }).select().single();
      if(!error && data){
        localComments.push({ id: data.id, handle: currentUser.handle, body: text, time: Date.now() });
        p.replies += 1;
        renderCommentsList();
        renderFeed();
        textarea.value = "";
      }
    }catch(e){ /* best-effort */ }
    sendBtn.disabled = false;
  });
}

/* ================= Ticker detail sheet ================= */
let detailSort = "top";

function openDetail(sym){
  const t = TICKERS.find(t=>t.sym===sym);
  const { bullPct, bearPct, bull, bear } = sentimentSplit(sym);
  const up = t.chg >= 0;
  const watched = userState.watch.includes(sym);
  const sortedRelated = () => {
    const list = posts.filter(p=>p.sym===sym);
    if(detailSort === "top") return list.slice().sort((a,b)=> b.likes - a.likes);
    return list.slice().sort((a,b)=> b.time - a.time);
  };
  const related = sortedRelated();

  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.id = "detailOverlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="detail-head">
          <span class="detail-sym">${t.sym}</span>
          <span class="chg ${up?'up':'down'}" style="font-size:0.9rem;">${up?'▲':'▼'} ${Math.abs(t.chg).toFixed(2)}%</span>
        </div>
        <button class="sheet-close" id="closeDetail">&times;</button>
      </div>
      <div class="detail-sub">${t.name} &middot; $${t.price.toFixed(2)}</div>
      <div class="detail-stats">
        <div class="dstat"><div class="n">${related.length}</div><div class="l">posts</div></div>
        <div class="dstat"><div class="n" style="color:var(--bull)">${bullPct}%</div><div class="l">bullish</div></div>
        <div class="dstat"><div class="n" style="color:var(--bear)">${bearPct}%</div><div class="l">bearish</div></div>
      </div>
      <div class="gauge" style="margin-bottom:16px;">
        <div class="gauge-bull" style="width:${bullPct}%"></div>
        <div class="gauge-bear" style="width:${bearPct}%"></div>
      </div>
      <button class="watch-btn ${watched?'on':''}" id="detailWatchBtn" style="width:100%;justify-content:center;margin-bottom:16px;padding:9px 0;">${starIcon}${watched?'Watching this ticker':'Add to watchlist'}</button>
      <div>
        <label class="field-label" style="margin:0 0 8px;">Takes</label>
        <div class="chiprow" id="detailSortChips" style="padding:0; justify-content:center;">
          <button class="chip ${detailSort==='latest'?'active':''}" data-sort="latest">Latest</button>
          <button class="chip ${detailSort==='top'?'active':''}" data-sort="top">Top</button>
        </div>
      </div>
      <div id="detailPosts" style="margin-top:14px;">${related.length ? related.map(postCardHTML).join("") : '<div class="empty" style="padding:30px 10px;">No posts yet on '+sym+'.</div>'}</div>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById("detailSortChips").addEventListener("click",(e)=>{
    const chip = e.target.closest(".chip");
    if(!chip) return;
    detailSort = chip.dataset.sort;
    overlay.remove();
    openDetail(sym);
  });

  overlay.addEventListener("click",(e)=>{ if(e.target === overlay) overlay.remove(); });
  document.getElementById("closeDetail").addEventListener("click", ()=>overlay.remove());
  document.getElementById("detailWatchBtn").addEventListener("click", ()=>{ toggleWatch(sym); overlay.remove(); openDetail(sym); });
  document.getElementById("detailPosts").addEventListener("click",(e)=>{
    const likeBtn = e.target.closest(".like-btn");
    if(likeBtn){
      const id = likeBtn.dataset.id;
      const p = posts.find(p=>p.id===id);
      const already = !!userState.liked[id];
      if(already){ delete userState.liked[id]; p.likes -= 1; }
      else{ userState.liked[id] = true; p.likes += 1; }
      saveState();
      overlay.remove();
      openDetail(sym);
      renderFeed();
      return;
    }
    const followBtn = e.target.closest(".follow-btn");
    if(followBtn){
      toggleFollow(followBtn.dataset.handle);
      overlay.remove();
      openDetail(sym);
      renderFeed();
      return;
    }
    const authorLink = e.target.closest(".post-author-link");
    if(authorLink){ overlay.remove(); openProfile(authorLink.dataset.handle); return; }
    const agreeBtn = e.target.closest(".agree-btn");
    if(agreeBtn){
      toggleAgree(agreeBtn.dataset.id);
      overlay.remove();
      openDetail(sym);
      renderFeed();
      return;
    }
    const replyBtn = e.target.closest(".reply-btn");
    if(replyBtn){ openComments(replyBtn.dataset.id); }
  });
}

/* ================= Live prices (Alpaca via edge function) ================= */
async function loadLivePrices(){
  const symbols = TICKERS.map(t=>t.sym).join(",");
  try{
    const [snapRes, barsRes] = await Promise.all([
      fetch(`${MARKET_DATA_URL}?symbols=${symbols}&mode=snapshot`, {
        headers: { Authorization: "Bearer " + SUPABASE_ANON_KEY }
      }),
      fetch(`${MARKET_DATA_URL}?symbols=${symbols}&mode=bars`, {
        headers: { Authorization: "Bearer " + SUPABASE_ANON_KEY }
      })
    ]);
    if(snapRes.ok){
      const snap = await snapRes.json();
      TICKERS.forEach(t=>{
        const s = snap[t.sym];
        if(s && s.price != null){ t.price = s.price; t.chg = s.chg; }
      });
    }
    if(barsRes.ok){
      const bars = await barsRes.json();
      TICKERS.forEach(t=>{
        const b = bars[t.sym];
        if(b && b.length > 1) t.hist = b;
      });
    }
    renderTape();
    renderGainers();
    renderTrending();
    renderWatch();
  }catch(e){ /* market-data function not live yet — keep showing demo prices */ }
}
if(sb) loadLivePrices();

/* ================= Init ================= */
renderFeed();
renderTrending();
renderWatch();

})();
</script>
